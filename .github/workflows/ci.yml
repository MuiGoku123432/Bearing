name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Use the exact Go version declared in go.mod.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      # Build-time tool: go run fetches it without adding it to go.mod.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
